<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    <title>Scoreboard - Basketball</title>
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <h3 class="h3-class">HOME</h3>
            <p class="counter-points" id="counter-home">0</p>
            <ul class="points-btn">
                <li><button id="addOneH" onclick="addOneHome()">+1</button></li>
                <li><button id="addTwoH" onclick="addTwoHome()">+2</button></li>
                <li><button id="addThreeH" onclick="addThreeHome()">+3</button></li>
            </ul>
            <button class="reset-btn" onclick="resetHome()">RESET</button>
        </div>
        <div class="scoreboard">
            <h3 class="h3-class">HOME</h3>
            <p class="counter-points" id="counter-away">0</p>
            <ul class="points-btn">
                <li><button id="addOne" onclick="addOneAway()">+1</button></li>
                <li><button id="addTwo" onclick="addTwoAway()">+2</button></li>
                <li><button id="addThree" onclick="addThreeAway()">+3</button></li>
            </ul>
            <button class="reset-btn" onclick="resetAway()">RESET</button>
        </div>

    </div>
</body>
<script src="index.js"></script>
</html>
